# The check that nothing has broken, for both platforms.
#
# Android is the regression gate CLAUDE.md names, and it runs on Linux because nothing about it
# needs a Mac. iOS cannot be built anywhere but a Mac — the Kotlin/Native link step needs Xcode —
# and it cannot be built on an Intel one either, since Compose Multiplatform stopped publishing
# an ios_x64 variant after 1.9.3. macos-15 runners are Apple Silicon with Xcode 16, which is why
# the iOS job lives here rather than on a developer's laptop.

name: build

on:
  push:
    # the port branch as well as main: the iOS half cannot be checked on the machine it is
    # written on, so it needs to reach a runner without waiting for a merge
    branches: [main, ios-port]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      # lfs, because .gitattributes puts every mp3 in LFS and checkout does not fetch it by
      # default — without this the APK ships 130-byte pointer files in place of the bowls
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check the bundled audio is audio
        run: .github/check-media.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # verifies gradle-wrapper.jar against the published checksums before running it
      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # the runner image carries an Android SDK but does not put sdkmanager on PATH, so calling it
      # directly exits 127. This action installs the packages and accepts the licences itself.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Test and assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/android.log

      - name: Say what failed
        if: failure()
        run: .github/print-test-failures.sh /tmp/android.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      # lfs, because .gitattributes puts every mp3 in LFS and checkout does not fetch it by
      # default — without this the APK ships 130-byte pointer files in place of the bowls
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check the bundled audio is audio
        run: .github/check-media.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Compose Multiplatform 1.11.1 is built against the iOS 26 SDK: ui-uikit references
      # UIViewLayoutRegion, which does not exist in Xcode 16, and the link dies on an undefined
      # Objective-C class rather than on anything in this repository. The runner image ships
      # several Xcode 26.x but still defaults to 16.4, so it has to be chosen.
      # newest available rather than a named version, with 26 as the floor: matching Xcode_26*
      # by name would stop finding anything the day the image ships Xcode 27, and a pipeline that
      # breaks on someone else's release schedule is one that breaks while an OS update has
      # already knocked the app off the store.
      - name: Use an Xcode new enough for Compose Multiplatform
        run: .github/select-xcode.sh 26

      # the Kotlin/Native distribution is ~1 GB and unpacks per Kotlin version, so it is worth
      # keeping between runs; the key is the Kotlin version the root build script pins
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # compiling needs no Xcode, but linking a framework and booting a simulator do
      - name: Compile the shared code for a phone
        run: ./gradlew --no-daemon :app:compileKotlinIosArm64 :app:compileTestKotlinIosArm64

      # the real point of the job: StorageTest and SessionTest executed by the iOS compiler, so a
      # backup written on Android is proven to open on an iPhone rather than assumed to
      - name: Run the shared tests on the iOS simulator
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:iosSimulatorArm64Test 2>&1 | tee /tmp/ios.log

      - name: Say what failed
        if: failure()
        run: .github/print-test-failures.sh /tmp/ios.log

      # XcodeGen from a pinned release rather than brew: brew update is minutes of nothing, and a
      # pinned binary means the project generated today is the project generated next year
      - name: Install XcodeGen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          # the zip nests a xcodegen/ directory, and the binary needs its sibling share/ beside it
          bin=$(find /tmp/xcodegen -type f -path '*/bin/xcodegen' | head -1)
          [ -n "$bin" ] || { echo "::error title=XcodeGen missing::not found in the release zip"; exit 1; }
          echo "XCODEGEN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          "$XCODEGEN" generate
          ls -d iosApp.xcodeproj

      # a real app bundle for a real arm64 phone, unsigned. AltStore and SideStore re-sign it with
      # a free Apple ID, so this is installable without a paid membership or a modern Mac.
      - name: Build the app for a device
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/ios-device.log | xcbeautify || {
              .github/print-test-failures.sh /tmp/ios-device.log; exit 1; }

      - name: Wrap it as an ipa
        run: |
          .github/package-ipa.sh \
            build/ios-device/Build/Products/Debug-iphoneos/OpenBreath.app \
            build/OpenBreath-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: OpenBreath-unsigned-ipa
          path: build/OpenBreath-unsigned.ipa

      # and the same app actually running, for when there is no phone to hand: a breathing cue is
      # an animation, and a still frame cannot show whether it moves
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim \
            build 2>&1 | tee /tmp/ios-sim.log | xcbeautify || {
              .github/print-test-failures.sh /tmp/ios-sim.log; exit 1; }

      - name: Run it and film it
        run: .github/record-simulator.sh build/ios-sim/Build/Products/Debug-iphonesimulator/OpenBreath.app

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-recording
          path: |
            build/recording/*.png
            build/recording/*.mp4
            build/recording/*.log
            build/recording/*.ips
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
