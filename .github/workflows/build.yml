# The check that nothing has broken, for both platforms.
#
# Android is the regression gate CLAUDE.md names, and it runs on Linux because nothing about it
# needs a Mac. iOS cannot be built anywhere but a Mac — the Kotlin/Native link step needs Xcode —
# and it cannot be built on an Intel one either, since Compose Multiplatform stopped publishing
# an ios_x64 variant after 1.9.3. macos-15 runners are Apple Silicon with Xcode 16, which is why
# the iOS job lives here rather than on a developer's laptop.

name: build

on:
  push:
    # the port branches as well as main: neither the iOS half nor the Windows and macOS halves can
    # be checked on the machine they are written on, so they need to reach a runner without waiting
    # for a merge. A branch not listed here still builds through pull_request
    branches: [main, ios-port, desktop-port]
  pull_request:
  # Both of these are off by default, and that is the point of them existing. A manual run used to
  # mean "upload to App Store Connect", which burns a build number that can never be reused and
  # mails every TestFlight tester — so the moment there was a second reason to run this by hand,
  # the reason had to be said rather than assumed.
  workflow_dispatch:
    inputs:
      app_store:
        description: Sign a Release build and upload it to App Store Connect
        type: boolean
        default: false
      submit_review:
        description: Submit the release for App Review — this run's upload, or the newest build of it
        type: boolean
        default: false
      screenshots:
        description: Retake the App Store screenshots from a 6.9" simulator
        type: boolean
        default: false
      previews:
        description: Refilm the App Store preview videos of the breathing cue
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      # the same run number the iOS job stamps, so a build of one commit reports the same version
      # on both phones. Unset outside CI, where the build falls back to what shipped rather than
      # letting a laptop build claim to be a release
      OPENBREATH_BUILD: ${{ github.run_number }}

    steps:
      # lfs, because .gitattributes puts every mp3 in LFS and checkout does not fetch it by
      # default — without this the APK ships 130-byte pointer files in place of the bowls
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check the bundled audio is audio
        run: .github/check-media.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # verifies gradle-wrapper.jar against the published checksums before running it
      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # the runner image carries an Android SDK but does not put sdkmanager on PATH, so calling it
      # directly exits 127. This action installs the packages and accepts the licences itself.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Test and assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/android.log

      - name: Say what failed
        if: failure()
        run: .github/print-test-failures.sh /tmp/android.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15

    env:
      # One monotonic number for both, from the run counter, so a push always advertises a version
      # higher than the one on the phone. It has to reach the ipa *and* the source JSON identically:
      # SideStore compares the source against the installed bundle, and a mismatch either hides the
      # update forever or offers it forever.
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}

    steps:
      # lfs, because .gitattributes puts every mp3 in LFS and checkout does not fetch it by
      # default — without this the APK ships 130-byte pointer files in place of the bowls
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check the bundled audio is audio
        run: .github/check-media.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Compose Multiplatform 1.11.1 is built against the iOS 26 SDK: ui-uikit references
      # UIViewLayoutRegion, which does not exist in Xcode 16, and the link dies on an undefined
      # Objective-C class rather than on anything in this repository. The runner image ships
      # several Xcode 26.x but still defaults to 16.4, so it has to be chosen.
      # newest available rather than a named version, with 26 as the floor: matching Xcode_26*
      # by name would stop finding anything the day the image ships Xcode 27, and a pipeline that
      # breaks on someone else's release schedule is one that breaks while an OS update has
      # already knocked the app off the store.
      - name: Use an Xcode new enough for Compose Multiplatform
        run: .github/select-xcode.sh 26

      # the Kotlin/Native distribution is ~1 GB and unpacks per Kotlin version, so it is worth
      # keeping between runs; the key is the Kotlin version the root build script pins
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # compiling needs no Xcode, but linking a framework and booting a simulator do
      # tee'd, because "Say what failed" can only annotate a log that exists. Without this a
      # compile error reaches the job log and nowhere else — and the job log is the one thing
      # that needs a token to read, so the failure becomes invisible from outside CI
      - name: Compile the shared code for a phone
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:compileKotlinIosArm64 :app:compileTestKotlinIosArm64 2>&1 \
            | tee /tmp/ios.log

      # the real point of the job: StorageTest and SessionTest executed by the iOS compiler, so a
      # backup written on Android is proven to open on an iPhone rather than assumed to
      - name: Run the shared tests on the iOS simulator
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:iosSimulatorArm64Test 2>&1 | tee /tmp/ios.log

      - name: Say what failed
        if: failure()
        run: .github/print-test-failures.sh /tmp/ios.log

      # XcodeGen from a pinned release rather than brew: brew update is minutes of nothing, and a
      # pinned binary means the project generated today is the project generated next year
      - name: Install XcodeGen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          # the zip nests a xcodegen/ directory, and the binary needs its sibling share/ beside it
          bin=$(find /tmp/xcodegen -type f -path '*/bin/xcodegen' | head -1)
          [ -n "$bin" ] || { echo "::error title=XcodeGen missing::not found in the release zip"; exit 1; }
          echo "XCODEGEN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          "$XCODEGEN" generate
          ls -d iosApp.xcodeproj

      # a real app bundle for a real arm64 phone, unsigned. AltStore and SideStore re-sign it with
      # a free Apple ID, so this is installable without a paid membership or a modern Mac.
      - name: Build the app for a device
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/ios-device.log | xcbeautify || {
              .github/print-test-failures.sh /tmp/ios-device.log; exit 1; }

      - name: Wrap it as an ipa
        run: |
          .github/package-ipa.sh \
            build/ios-device/Build/Products/Debug-iphoneos/OpenBreath.app \
            build/OpenBreath-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: OpenBreath-unsigned-ipa
          path: build/OpenBreath-unsigned.ipa

      # The ipa reaches a phone from the `publish` job at the bottom, not from here — see the
      # comment on that job for why nothing writes to the release from the job that built it.

      # and the same app actually running, for when there is no phone to hand: a breathing cue is
      # an animation, and a still frame cannot show whether it moves
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim \
            build 2>&1 | tee /tmp/ios-sim.log | xcbeautify || {
              .github/print-test-failures.sh /tmp/ios-sim.log; exit 1; }

      - name: Run it and film it
        run: .github/record-simulator.sh build/ios-sim/Build/Products/Debug-iphonesimulator/OpenBreath.app

      # The App Store screenshots, and workflow_dispatch only — for the same reason the Android set
      # is a command someone types. A screenshot is a claim about what the app looks like, so it is
      # retaken when a screen changes, which is a decision rather than a consequence of a push. It
      # also boots and drives a simulator for a couple of minutes on the priciest runner there is.
      - name: Take the App Store screenshots
        if: inputs.screenshots
        run: .github/ios-screenshots.sh docs/store/ios

      # The preview videos, and the same reasoning: manual, because a video of the cue is retaken
      # when the cue changes. It films a simulator in real time — 22 seconds of breathing cannot be
      # hurried — and installs ffmpeg if the image has none, so it is the slowest thing here.
      - name: Film the App Store previews
        if: inputs.previews
        run: .github/ios-previews.sh docs/store/ios

      - uses: actions/upload-artifact@v7
        # always(), so a failed run still hands over the driver's log; warn rather than error
        # because on a failure there is legitimately no mp4, and the real cause is already annotated
        if: always() && inputs.previews
        with:
          name: app-store-previews
          # docs/store/ios is where the same command puts them on a laptop, and it is gitignored:
          # somewhere obvious to find rather than 36 MB carried in the repository
          path: |
            docs/store/ios/*-breathing.mp4
            docs/store/ios/preview-work/*/xcodebuild.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always() && inputs.screenshots
        with:
          name: app-store-screenshots
          # the directories rather than a glob: the shots are one level down, in iphone/ and ipad/,
          # and `*.png` matched nothing while the step that made them reported success
          path: |
            docs/store/ios/iphone
            docs/store/ios/ipad
          # error, not warn. A screenshot run whose whole product is an artifact should be red when
          # there is no artifact.
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-recording
          path: |
            build/recording/*.png
            build/recording/*.mp4
            build/recording/*.log
            build/recording/*.ips
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

  # The desktop: one source set, three installers, and jpackage builds only for the machine it runs
  # on — which is the whole reason this is three jobs rather than one. Nothing about the *code*
  # differs between them.
  #
  # The Linux job carries the shared test suite as well, and that is not arbitrary: desktopTest
  # inherits commonTest, so StorageTest and the session engine get checked by a third compiler.
  # It is also the fastest of the three and the cheapest runner, so it is the one worth failing early.
  desktop-linux:
    runs-on: ubuntu-latest

    env:
      OPENBREATH_BUILD: ${{ github.run_number }}

    steps:
      # lfs for the bowls as everywhere, and now for the launcher icons too: jpackage refuses a
      # 130-byte .ico, so without this the packaging step fails on something that reads as a
      # corrupt icon rather than as a checkout that skipped LFS
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check the bundled audio is audio
        run: .github/check-media.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Test the shared code on a third compiler, then package
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:desktopTest :app:packageDeb 2>&1 | tee /tmp/desktop-linux.log

      - name: Say what failed
        if: failure()
        run: .github/print-test-failures.sh /tmp/desktop-linux.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/desktopTest/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: OpenBreath-deb
          path: app/build/compose/binaries/main/deb/*.deb

  desktop-windows:
    runs-on: windows-latest

    env:
      OPENBREATH_BUILD: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # WiX is on the runner image already, which is the only reason an .msi can be built here at
      # all — jpackage shells out to it and says only "candle.exe not found" when it is missing.
      #
      # The unsigned installer is the point to know about rather than a fault to fix: SmartScreen
      # warns on it, and quieting that needs an Authenticode certificate, which is the same
      # missing-certificate problem the iOS build has.
      - name: Package the installer
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:packageMsi 2>&1 | tee /tmp/desktop-windows.log

      - name: Say what failed
        if: failure()
        shell: bash
        run: .github/print-test-failures.sh /tmp/desktop-windows.log

      - uses: actions/upload-artifact@v7
        with:
          name: OpenBreath-msi
          path: app/build/compose/binaries/main/msi/*.msi

  # Alongside the ios job rather than inside it: they share a runner image and nothing else, and a
  # failure to link an iOS framework should not hide whether the desktop app builds.
  desktop-macos:
    runs-on: macos-15

    env:
      OPENBREATH_BUILD: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Unsigned and unnotarised, so Gatekeeper refuses it on a double-click and wants
      # right-click → Open. Same certificate that the iOS half is waiting on.
      - name: Package the disk image
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:packageDmg 2>&1 | tee /tmp/desktop-macos.log

      - name: Say what failed
        if: failure()
        run: .github/print-test-failures.sh /tmp/desktop-macos.log

      - uses: actions/upload-artifact@v7
        with:
          name: OpenBreath-dmg
          path: app/build/compose/binaries/main/dmg/*.dmg

  # The one writer for the rolling `latest` release, where there used to be four.
  #
  # An artifact cannot be downloaded without a GitHub login, and SideStore has none, so the ipa,
  # its apps.json and the three installers have to be public release assets on a tag whose URLs
  # never move. That part is unchanged. What changed is who does it: each of the four jobs used to
  # upload what it had just built, which meant four concurrent `gh release upload --clobber`
  # against one release. `--clobber` is delete-then-upload, and two of them raced badly enough to
  # answer "HTTP 404" on a release id that had moved under them — a red build over nothing, with
  # every installer on the release intact.
  #
  # One job cannot race itself, and `concurrency` then keeps two *runs* from colliding, which is
  # what actually happened: a push and a manual dispatch seconds apart, both live at once.
  #
  # The group could not simply have been put on the four jobs instead. Only one job per group may
  # be pending, so the three siblings would have cancelled each other rather than queued — the
  # opposite of the intent, and it would have looked like flaky infrastructure.
  #
  # cancel-in-progress is false on purpose: a queued publish is not stale work to be dropped, it is
  # the previous run's downloads waiting their turn.
  #
  # Publishing now needs all four builds green, where before a broken Windows build still put a
  # .deb up. That is the trade for a consistent set, and it is the right way round: a run that
  # failed has no business replacing what a reader is being offered.
  publish:
    name: Publish the downloads
    runs-on: ubuntu-latest
    needs: [ios, desktop-linux, desktop-windows, desktop-macos]
    # a fork's token cannot write, and a PR build has no business replacing what is offered
    if: github.event_name != 'pull_request'

    # The only job that writes to the repository, now that it is the only one that touches the
    # release. Named here rather than at the top of the file so every other job stays read-only —
    # and the omission fails exactly as it did the first time this job ran: 403 on the asset
    # delete inside `--clobber`, with all four builds already green.
    permissions:
      contents: write

    concurrency:
      group: publish-latest
      cancel-in-progress: false

    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      # for the two scripts below; no LFS, since nothing here reads the bundled audio
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with: { name: OpenBreath-deb, path: downloads/deb }
      - uses: actions/download-artifact@v7
        with: { name: OpenBreath-msi, path: downloads/msi }
      - uses: actions/download-artifact@v7
        with: { name: OpenBreath-dmg, path: downloads/dmg }
      - uses: actions/download-artifact@v7
        with: { name: OpenBreath-unsigned-ipa, path: downloads/ipa }

      # jpackage names its output after the version, so each of these is a glob resolving to the
      # one file the artifact holds, copied to the fixed name the README links.
      - name: Publish the installers
        run: |
          set -euo pipefail
          .github/publish-desktop.sh 'downloads/deb/*.deb' OpenBreath.deb
          .github/publish-desktop.sh 'downloads/msi/*.msi' OpenBreath.msi
          .github/publish-desktop.sh 'downloads/dmg/*.dmg' OpenBreath.dmg

      - name: Publish the ipa and the source for over-the-air updates
        run: |
          set -euo pipefail

          # The ipa carries its version in the filename, and that is the whole trick: SideStore
          # caches the source and checks the version it downloaded against the version it was
          # promised. One fixed ipa URL whose contents keep changing fails that check on every
          # phone whose cache is a build or two behind — "expected 30, got 32". A per-version name
          # means a stale cache asks for the build it still believes in, gets exactly that, and
          # installs; the newer one is offered on the next refresh instead of erroring now.
          #
          # apps.json keeps its fixed name, because that URL is typed into the phone once.
          ipa="OpenBreath-$VERSION.ipa"
          cp downloads/ipa/OpenBreath-unsigned.ipa "$ipa"

          .github/make-source.sh \
            "$ipa" "$VERSION" "$BUILD" \
            "https://github.com/$REPO/releases/download/latest/$ipa" \
            apps.json

          # one rolling prerelease rather than a tag per build: the source URL has to stay put, and
          # a year of test builds is not release history worth keeping
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --prerelease \
            --title "Latest test build" \
            --notes "Rolling builds for sideloading. Not a release."

          gh release upload latest "$ipa" apps.json --clobber

          # The old ipas are what stale caches resolve against, so several are kept on purpose; left
          # unbounded they are 18 MB per push forever.
          #
          # Counted rather than `head -n -5`: this used to run on macOS, where BSD head answers
          # "illegal line count", and there is no reason to reintroduce the trap. `|| true` because
          # a grep that matches nothing exits 1, which under pipefail would fail the build over
          # there being nothing to tidy.
          keep=5
          names="$(gh release view latest --json assets --jq '.assets[].name' \
            | grep -E '^OpenBreath-.*\.ipa$' | sort -V || true)"
          total="$(printf '%s' "$names" | grep -c . || true)"
          if [ "${total:-0}" -gt "$keep" ]; then
            printf '%s\n' "$names" | sed -n "1,$((total - keep))p" | while read -r stale; do
              [ -n "$stale" ] || continue
              echo "pruning $stale"
              gh release delete-asset latest "$stale" --yes
            done
          fi

          echo "### Sideloading" >> "$GITHUB_STEP_SUMMARY"
          echo "Version \`$VERSION\` is live. SideStore source URL:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$REPO/releases/download/latest/apps.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Signing and uploading, deliberately kept apart from the job above.
  #
  # Manual only. A build that reaches App Store Connect burns a build number that can never be
  # reused and, once TestFlight is on, mails every tester — neither of which should happen because
  # someone fixed a typo. Run it from the Actions tab when there is something worth shipping.
  #
  # Everything it needs is a repository secret. No Mac of anyone's is involved: the certificate was
  # issued through the App Store Connect API, and the upload authenticates with an API key rather
  # than an Apple ID, so nothing here knows a password.
  app-store:
    name: Upload to App Store Connect
    runs-on: macos-15
    if: inputs.app_store

    env:
      # Stable, where the sideloading half of this workflow stamps 1.0.<run number>. The two want
      # opposite things and only look alike.
      #
      # SideStore compares the version a source advertises against the bundle on the phone, so the
      # ipa the `ios` job builds has to climb on every push or an update is never offered. The App
      # Store wants the reverse: CFBundleShortVersionString is the *release*, one record in App
      # Store Connect, with CFBundleVersion climbing underneath it. Stamping the run number into
      # both filed every upload under a version of its own — 1.0.70, then 1.0.115, then 1.0.120 —
      # so a build could not be attached to the record it was meant to fix without editing that
      # record's version number first, which looks exactly like an upload that never arrived.
      #
      # **It can only ever go up, which is what "stable" missed.** A marketing version has to be
      # higher than the last *approved* one, and 1.0.120 is approved and live — so stamping 1.0
      # was a downgrade and altool refused the build outright: "CFBundleShortVersionString [1.0]
      # must contain a higher version than the previously approved version [1.0.120]". 1.1 is
      # higher than 1.0.120 and is what a feature release wants to be called anyway.
      #
      # It happened again on 2026-09-19, one version later and for the better reason: 1.1 went
      # live on 2026-09-12, so leaving this at 1.1 got both halves of the same refusal at once —
      # "The train version '1.1' is closed for new build submissions" and the approved-version
      # message above with [1.1] on both sides. **A shipped version closes its train**, so this
      # line is bumped as part of deciding to release, not after an upload is refused.
      #
      # So it is bumped by hand, once per release, in one place: MARKETING_VERSION in
      # `iosApp/project.yml`. The step after checkout reads it into VERSION here, and
      # app/build.gradle.kts reads the same line, unchanged, for Play's versionName and the desktop
      # installers. The build number underneath it keeps climbing on its own, in a field of its own.
      BUILD: ${{ github.run_number }}
      BUNDLE_ID: io.github.wlemkens.openbreath
      PROFILE_NAME: OpenBreath App Store
      # Release is the first Kotlin/Native build that optimises the whole program at once, and it
      # runs out of the 2g gradle.properties gives: "Compilation failed: Java heap space" from
      # inside Xcode's script phase. The ios job never hit it because a Debug framework is a far
      # lighter compile. Raised here rather than in gradle.properties so a laptop is not asked for
      # 4g to build an APK; the runner has about 7g, so this leaves room for Xcode beside it.
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check the bundled audio is audio
        run: .github/check-media.sh

      - name: Read the release from project.yml
        run: |
          v=$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9.]*\)".*/\1/p' iosApp/project.yml)
          [ -n "$v" ] || { echo "::error title=No MARKETING_VERSION::iosApp/project.yml has no MARKETING_VERSION: \"x.y\" line"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Use an Xcode new enough for Compose Multiplatform
        run: .github/select-xcode.sh 26

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # A keychain of its own, unlocked for this run and deleted after it, rather than the
      # runner's login keychain: a hosted runner is thrown away anyway, but a build that leaves a
      # private key in a shared keychain is a habit that eventually runs somewhere that is not.
      - name: Take the signing identity in
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # without this codesign stops to ask for permission, and a runner has nobody to ask
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          # Xcode looks for profiles by UUID in this directory and nowhere else
          profiles=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$profiles"
          echo "$PROFILE" | base64 --decode > "$profiles/openbreath.mobileprovision"

          echo "identity in the keychain:"
          security find-identity -v -p codesigning "$keychain"

      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          bin=$(find /tmp/xcodegen -type f -path '*/bin/xcodegen' | head -1)
          "$bin" generate

      # Release, and signed with the identity above. The signing settings are given here rather
      # than in project.yml because that file has to keep producing the *unsigned* build the
      # sideloading job wants — command-line settings win over the project's own.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenBreath.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive 2>&1 | tee /tmp/archive.log | xcbeautify || {
              .github/print-test-failures.sh /tmp/archive.log; exit 1; }

      - name: Export the ipa
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenBreath.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee /tmp/export.log | xcbeautify || {
              .github/print-test-failures.sh /tmp/export.log; exit 1; }
          ls -la "$RUNNER_TEMP/export"

      # altool wants the key on disk, in this directory, named exactly this. An API key rather
      # than an Apple ID: no password exists to leak, and it cannot be locked out by 2FA.
      #
      # **altool's exit code is not to be trusted.** Build 141 printed "UPLOAD FAILED with 2
      # errors" and "Failed to upload package", and exited 0 — so `pipefail` and `||` both read it
      # as a success and this job went green on a submission that never arrived, which is the one
      # failure mode worse than a red build. A real upload says "No errors uploading"; that line,
      # and not `$?`, is what decides.
      - name: Upload
        run: |
          set -o pipefail
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode \
            > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/OpenBreath.ipa" -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee /tmp/upload.log || true
          if ! grep -q "No errors uploading" /tmp/upload.log; then
            # the validation lines carry the whole answer — and an annotation is readable without
            # a token, which a job log is not
            grep -E "Validation failed \([0-9]+\)|Failed to upload" /tmp/upload.log \
              | sed -e 's/^ *//' -e 's/ (ID: .*//' | sort -u | head -5 \
              | while IFS= read -r line; do
                  echo "::error title=App Store upload rejected::$line"
                done || true
            exit 1
          fi
          echo "Uploaded build $BUILD as version $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # if: always() — a failed archive still leaves a key in a keychain, and the point of a
      # throwaway keychain is that it is actually thrown away
      - name: Put the signing identity back
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f ~/private_keys/AuthKey_*.p8
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/openbreath.mobileprovision

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-store-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

  # What used to be typed into App Store Connect by hand before every submission — What's New in
  # three languages, the review notes, the build, the button — from the files that already hold it.
  # See .github/submit-review.py for what it reads and in which order.
  #
  # Its own input rather than part of the upload, because the two are different commitments: an
  # upload reaches testers, a submission reaches the public once approved. Without app_store it
  # submits the newest build of the release already up, which is how a build is sent to review
  # without spending a rebuild on it.
  #
  # Linux: it is HTTP and nothing else, and a macOS runner costs ten times the minutes to wait on.
  app-store-review:
    name: Submit for App Review
    runs-on: ubuntu-latest
    needs: app-store
    if: always() && inputs.submit_review && (needs.app-store.result == 'success' || needs.app-store.result == 'skipped')
    # a fresh upload is listed after minutes and processed after more; the script waits 90
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7

      - name: Submit
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # this run's build when it uploaded one, else the newest valid build of the release
          BUILD: ${{ inputs.app_store && github.run_number || '' }}
        run: python3 .github/submit-review.py 2>&1 | tee /tmp/submit.log
